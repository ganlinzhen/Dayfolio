_content_materials</text><line x1="572" y1="695" x2="928" y2="695" stroke="#22d3ee" stroke-opacity="0.25"/><text x="576" y="720" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">联合 PK / FK：content_id, material_id</text><text x="576" y="745" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">两端 SQL FK 均为 CASCADE</text><rect x="1210" y="650" width="380" height="130" rx="9" fill="#0f172a"/><rect x="1210" y="650" width="380" height="130" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="1400.0" y="680" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">media_content_versions</text><line x1="1222" y1="695" x2="1578" y2="695" stroke="#22d3ee" stroke-opacity="0.25"/><text x="1226" y="720" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · FK content_id</text><text x="1226" y="745" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">UNIQUE(content_id, platform)</text><rect x="60" y="925" width="380" height="120" rx="9" fill="#0f172a"/><rect x="60" y="925" width="380" height="120" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="250.0" y="955" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">vaults</text><line x1="72" y1="970" x2="428" y2="970" stroke="#22d3ee" stroke-opacity="0.25"/><text x="76" y="995" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · root_path UNIQUE</text><text x="76" y="1020" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">注册目录 / include_dirs / 扫描配置</text><rect x="560" y="925" width="380" height="120" rx="9" fill="#0f172a"/><rect x="560" y="925" width="380" height="120" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="750.0" y="955" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">vault_notes</text><line x1="572" y1="970" x2="928" y2="970" stroke="#22d3ee" stroke-opacity="0.25"/><text x="576" y="995" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · FK vault_id</text><text x="576" y="1020" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">UNIQUE(vault_id, rel_path)</text><rect x="560" y="1130" width="380" height="130" rx="9" fill="#0f172a"/><rect x="560" y="1130" width="380" height="130" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="750.0" y="1160" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">vault_concept_links</text><line x1="572" y1="1175" x2="928" y2="1175" stroke="#22d3ee" stroke-opacity="0.25"/><text x="576" y="1200" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · FK note_id</text><text x="576" y="1225" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">vault_id 普通引用 / knowledge_key</text><text x="576" y="1250" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">UNIQUE(note_id, knowledge_key)</text><rect x="1210" y="900" width="380" height="125" rx="9" fill="#0f172a"/><rect x="1210" y="900" width="380" height="125" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="1400.0" y="930" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">media_calendar</text><line x1="1222" y1="945" x2="1578" y2="945" stroke="#22d3ee" stroke-opacity="0.25"/><text x="1226" y="970" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · FK content_version_id</text><text x="1226" y="995" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">planned_date / publish_url / status</text><rect x="1210" y="1130" width="380" height="125" rx="9" fill="#0f172a"/><rect x="1210" y="1130" width="380" height="125" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="1400.0" y="1160" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">media_metrics</text><line x1="1222" y1="1175" x2="1578" y2="1175" stroke="#22d3ee" stroke-opacity="0.25"/><text x="1226" y="1200" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · FK calendar_id</text><text x="1226" y="1225" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">UNIQUE(calendar_id, date)</text><rect x="60" y="1430" width="380" height="110" rx="9" fill="#0f172a"/><rect x="60" y="1430" width="380" height="110" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="250.0" y="1460" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">tool_categories</text><line x1="72" y1="1475" x2="428" y2="1475" stroke="#22d3ee" stroke-opacity="0.25"/><text x="76" y="1500" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · name UNIQUE</text><rect x="560" y="1430" width="380" height="110" rx="9" fill="#0f172a"/><rect x="560" y="1430" width="380" height="110" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="750.0" y="1460" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">tools</text><line x1="572" y1="1475" x2="928" y2="1475" stroke="#22d3ee" stroke-opacity="0.25"/><text x="576" y="1500" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · FK category_id（可空）</text><text x="576" y="1525" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">entry_file → 库旁 tools 文件</text><rect x="1080" y="1430" width="510" height="110" rx="9" fill="#0f172a"/><rect x="1080" y="1430" width="510" height="110" rx="9" fill="#94a3b8" fill-opacity="0.09" stroke="#94a3b8"/><text x="1335.0" y="1460" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">历史新闻兼容表</text><line x1="1092" y1="1475" x2="1578" y2="1475" stroke="#94a3b8" stroke-opacity="0.25"/><text x="1096" y="1500" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">news_sources / news_topics</text><text x="1096" y="1525" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">news_topic_links / news_sync_runs</text><text x="60" y="730" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">内容 ↔ 素材构成 N:M。</text><text x="60" y="760" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">中间表保存每一对实例关联。</text><text x="60" y="1300" font-size="13" fill="#94a3b8" text-anchor="start" font-weight="400">knowledge_key / source_note 不自动形成表间外键；原文与索引区分保存。</text><text x="50" y="1610" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">news → media_topics / media_materials 由业务服务校验与删除清理，未声明 SQL 外键。</text><text x="50" y="1640" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">课程、工具和新闻 HTML 保存在数据库旁；知识库原文与导出文件在外部目录。SQLite 只负责库内事务。</text><text x="50" y="1690" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">2026-10-14 · PK=主键；FK=PRAGMA 确认的 SQL 外键。历史兼容表之间的外键详见表结构明细。</text><text x="50" y="60" font-size="30" fill="#e2e8f0" text-anchor="start" font-weight="700">新闻、知识库、创作与工具 · 表关系</text><text x="50" y="95" font-size="16" fill="#cbd5e1" text-anchor="start" font-weight="400">实线绿色 = SQL 外键；虚线橙色 = 普通业务引用；各模块共用同一数据库。关键关联见图，完整清单见正文。</text></svg>