er="stroke" stroke="#0f172a" stroke-width="6" stroke-linejoin="round">对象映射</text><path d="M800 365V445" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-a78bfa)"/><text x="800" y="418" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#0f172a" stroke-width="6" stroke-linejoin="round">关系解析</text><path d="M1320 365V445" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-a78bfa)"/><text x="1320" y="418" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#0f172a" stroke-width="6" stroke-linejoin="round">动作执行</text><path d="M800 600V645" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-34d399)"/><text x="900" y="629" font-size="13" fill="#34d399" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#0f172a" stroke-width="6" stroke-linejoin="round">查询 / 写入</text><rect x="50" y="175" width="460" height="190" rx="9" fill="#0f172a"/><rect x="50" y="175" width="460" height="190" rx="9" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa"/><text x="280.0" y="205" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">ont_object_types</text><line x1="62" y1="220" x2="498" y2="220" stroke="#a78bfa" stroke-opacity="0.25"/><text x="66" y="245" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">28 个对象类型：27 个实体 + day 虚拟类型</text><text x="66" y="270" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">api_name → table_name / primary_key</text><text x="66" y="295" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">properties：JSON 字段定义</text><text x="66" y="320" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">一条类型记录，映射多条业务实例</text><rect x="570" y="175" width="460" height="190" rx="9" fill="#0f172a"/><rect x="570" y="175" width="460" height="190" rx="9" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa"/><text x="800.0" y="205" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">ont_link_types</text><line x1="582" y1="220" x2="1018" y2="220" stroke="#a78bfa" stroke-opacity="0.25"/><text x="586" y="245" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">29 个关系类型：19 强 / 9 历史 / 1 派生</text><text x="586" y="270" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">left_type / right_type / cardinality</text><text x="586" y="295" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">字段、多态引用或中间表承载关系</text><text x="586" y="320" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">config：引用属性与约束状态</text><rect x="1090" y="175" width="460" height="190" rx="9" fill="#0f172a"/><rect x="1090" y="175" width="460" height="190" rx="9" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa"/><text x="1320.0" y="205" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">ont_action_types</text><line x1="1102" y1="220" x2="1538" y2="220" stroke="#a78bfa" stroke-opacity="0.25"/><text x="1106" y="245" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">72 个内置动作记录，另可定义自定义动作</text><text x="1106" y="270" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">parameters / operations：JSON</text><text x="1106" y="295" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">内置动作绑定命令；自定义动作执行 DSL</text><text x="1106" y="320" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">动作记录不是独立表，也不是执行日志</text><rect x="50" y="445" width="1500" height="155" rx="9" fill="#0f172a"/><rect x="50" y="445" width="1500" height="155" rx="9" fill="#34d399" fill-opacity="0.09" stroke="#34d399"/><text x="800.0" y="475" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">本体运行时 + core 业务服务</text><line x1="62" y1="490" x2="1538" y2="490" stroke="#34d399" stroke-opacity="0.25"/><text x="66" y="515" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">ObjectRepo / RelationService / ActionService / Commands：按元数据解释实体、校验写入并调用业务规则</text><text x="66" y="540" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">系统核心字段走业务动作；自定义对象及允许的扩展字段通过通用仓储读写</text><text x="66" y="565" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">App 与 MCP 各自实例化 core，DbAdapter 连接同一份 SQLite；元数据表与实体表在同一数据库</text><rect x="50" y="680" width="460" height="225" rx="9" fill="#0f172a"/><rect x="50" y="680" width="460" height="225" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="280.0" y="710" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">学习与事务 · 9 表</text><line x1="62" y1="725" x2="498" y2="725" stroke="#22d3ee" stroke-opacity="0.25"/><text x="66" y="750" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">todos / study_plans / plan_items / checkins</text><text x="66" y="775" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">study_plan_drafts / study_sessions</text><text x="66" y="800" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">study_assessments / plan_adjustments</text><text x="66" y="825" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">card_exports</text><text x="66" y="850" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">计划与待办联动；证据、调整与导出留痕</text><rect x="570" y="680" width="460" height="225" rx="9" fill="#0f172a"/><rect x="570" y="680" width="460" height="225" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="800.0" y="710" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">课程 · 4 表</text><line x1="582" y1="725" x2="1018" y2="725" stroke="#22d3ee" stroke-opacity="0.25"/><text x="586" y="750" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">courses / course_lessons</text><text x="586" y="775" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">course_overviews / course_requests</text><text x="586" y="800" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">课程绑定计划；总览 1:0..1</text><text x="586" y="825" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">讲义和生成请求 1:N</text><text x="586" y="850" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">HTML 文件在库旁 courses 目录</text><rect x="1090" y="680" width="460" height="225" rx="9" fill="#0f172a"/><rect x="1090" y="680" width="460" height="225" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="1320.0" y="710" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">新闻 · 3 表</text><line x1="1102" y1="725" x2="1538" y2="725" stroke="#22d3ee" stroke-opacity="0.25"/><text x="1106" y="750" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">news_tasks / news</text><text x="1106" y="775" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">news_deleted_fingerprints</text><text x="1106" y="800" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">任务租约 → 新闻提交 → 阅读 / 收藏</text><text x="1106" y="825" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">删除指纹不依赖新闻行继续存在</text><text x="1106" y="850" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">可选 HTML 快照在库旁 news 目录</text><rect x="50" y="980" width="460" height="225" rx="9" fill="#0f172a"/><rect x="50" y="980" width="460" height="225" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="280.0" y="1010" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">知识库 · 3 表</text><line x1="62" y1="1025" x2="498" y2="1025" stroke="#22d3ee" stroke-opacity="0.25"/><text x="66" y="1050" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">vaults / vault_notes / vault_concept_links</text><text x="66" y="1075" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">知识库 → 笔记 → 知识点关联</text><text x="66" y="1100" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">knowledge_key 是语义键，无知识点总表</text><text x="66" y="1125" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">原 Markdown 只读；索引与关联在数据库</text><text x="66" y="1150" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">文件路径、哈希、元信息用于索引和阅读</text><rect x="570" y="980" width="460" height="225" rx="9" fill="#0f172a"/><rect x="570" y="980" width="460" height="225" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="800.0" y="1010" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">创作 · 7 表</text><line x1="582" y1="1025" x2="1018" y2="1025" stroke="#22d3ee" stroke-opacity="0.25"/><text x="586" y="1050" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">media_topics / media_contents</text><text x="586" y="1075" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">media_content_versions / media_materials</text><text x="586" y="1100" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">media_content_materials / media_calendar</text><text x="586" y="1125" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">media_metrics</text><text x="586" y="1150" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">内容与素材 N:M；平台版本 → 排期 → 指标</text><rect x="1090" y="980" width="460" height="225" rx="9" fill="#0f172a"/><rect x="1090" y="980" width="460" height="225" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="1320.0" y="1010" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">工具箱 · 2 表</text><line x1="1102" y1="1025" x2="1538" y2="1025" stroke="#22d3ee" stroke-opacity="0.25"/><text x="1106" y="1050" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">tool_categories / tools</text><text x="1106" y="1075" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">分类 → 工具：1:N，删除分类将引用置空</text><text x="1106" y="1100" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">入口元数据在 tools；文件在库旁目录</text><text x="1106" y="1125" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">工具 HTML 与配套资产由 core 服务管理</text><text x="1106" y="1150" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">本地文件协议供 App 读取展示</text><rect x="50" y="1250" width="1500" height="100" rx="9" fill="#0f172a"/><rect x="50" y="1250" width="1500" height="100" rx="9" fill="#94a3b8" fill-opacity="0.09" stroke="#94a3b8"/><text x="800.0" y="1280" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">历史兼容 · 4 表</text><line x1="62" y1="1295" x2="1538" y2="1295" stroke="#94a3b8" stroke-opacity="0.25"/><text x="66" y="1320" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">news_sources / news_topics / news_topic_links / news_sync_runs：旧来源、话题与抓取链路；当前 Agent 新闻任务不走该链路</text><text x="60" y="947" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">实体实例存各自物理表；箭头表示映射 / 访问，不表示元数据表与业务表具有 SQL 外键。</text><text x="50" y="1390" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">本机默认库实测 37 表：额外 ont_obj_daily_brief（自定义简报）与 news_config_meta（当前源码未创建 / 引用）。</text><text x="50" y="1420" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">29 个本体关系 ≠ 17 个 SQL 外键；虚拟 day 无表，自定义类型以 ont_obj_&lt;api_name&gt; 一类一表。</text><text x="50" y="1460" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">2026-10-14 · 当前源码 + 隔离结构验证 + 默认数据库只读检查 · 详细字段及关系策略见 database-design.md</text><text x="50" y="60" font-size="30" fill="#e2e8f0" text-anchor="start" font-weight="700">Dayfolio · 数据库与本体分层</text><text x="50" y="95" font-size="16" fill="#cbd5e1" text-anchor="start" font-weight="400">源码基线：3 张本体元数据表 + 28 张当前业务及辅助表 + 4 张历史兼容表 = 35 张</text></svg>