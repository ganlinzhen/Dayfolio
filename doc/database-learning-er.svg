-anchor="middle" font-weight="600">day · 虚拟日期锚点</text><line x1="92" y1="860" x2="488" y2="860" stroke="#94a3b8" stroke-opacity="0.25"/><text x="96" y="885" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">无物理表；每日打卡由 date 定位</text><rect x="600" y="815" width="420" height="80" rx="9" fill="#0f172a"/><rect x="600" y="815" width="420" height="80" rx="9" fill="#94a3b8" fill-opacity="0.09" stroke="#94a3b8"/><text x="810.0" y="845" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">card_exports · 导出记录</text><line x1="612" y1="860" x2="1008" y2="860" stroke="#94a3b8" stroke-opacity="0.25"/><text x="616" y="885" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id；UNIQUE card_key；file_path / hash</text><rect x="600" y="1000" width="330" height="100" rx="9" fill="#0f172a"/><rect x="600" y="1000" width="330" height="100" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="765.0" y="1030" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">courses（同上）</text><line x1="612" y1="1045" x2="918" y2="1045" stroke="#22d3ee" stroke-opacity="0.25"/><text x="616" y="1070" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · INTEGER</text><rect x="80" y="1190" width="330" height="130" rx="9" fill="#0f172a"/><rect x="80" y="1190" width="330" height="130" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="245.0" y="1220" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">course_lessons</text><line x1="92" y1="1235" x2="398" y2="1235" stroke="#22d3ee" stroke-opacity="0.25"/><text x="96" y="1260" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · FK course_id</text><text x="96" y="1285" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">UNIQUE(course_id, day)</text><text x="96" y="1310" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">html_rel / quiz / status</text><rect x="600" y="1190" width="330" height="130" rx="9" fill="#0f172a"/><rect x="600" y="1190" width="330" height="130" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="765.0" y="1220" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">course_overviews</text><line x1="612" y1="1235" x2="918" y2="1235" stroke="#22d3ee" stroke-opacity="0.25"/><text x="616" y="1260" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK + FK course_id</text><text x="616" y="1285" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">一门课程最多一条总览</text><text x="616" y="1310" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">html_rel / content_hash</text><rect x="1120" y="1190" width="330" height="130" rx="9" fill="#0f172a"/><rect x="1120" y="1190" width="330" height="130" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee"/><text x="1285.0" y="1220" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="600">course_requests</text><line x1="1132" y1="1235" x2="1438" y2="1235" stroke="#22d3ee" stroke-opacity="0.25"/><text x="1136" y="1260" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">PK id · FK course_id</text><text x="1136" y="1285" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">kind / status / claimed_by</text><text x="1136" y="1310" font-size="14" fill="#cbd5e1" text-anchor="start" font-weight="400">生成请求与完成状态</text><text x="1080" y="840" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">knowledge_key 为跨模块语义键。</text><text x="1080" y="870" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">无统一知识点实体表 / 外键。</text><text x="50" y="1390" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">历史引用无自动级联：删除计划或条目后，学习证据可继续保留；所有已注册关系完整清单见正文。</text><text x="50" y="1425" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">草案确认生成正式计划；完成条目联动待办和打卡。该业务联动由 core 执行，不等同于外键本身的行为。</text><text x="50" y="1470" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">2026-10-14 · 图中只选取关键关联，PK=主键，FK=实际 SQL 外键；箭头旁 1:N 指源到目标数量。</text><text x="50" y="60" font-size="30" fill="#e2e8f0" text-anchor="start" font-weight="700">学习、待办与课程 · 表关系</text><text x="50" y="95" font-size="16" fill="#cbd5e1" text-anchor="start" font-weight="400">实线绿色 = SQL 外键；虚线紫色 = 历史普通引用；虚线橙色 = 多态业务引用。箭头从父对象指向关联记录。</text></svg>